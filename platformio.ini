; ESP32 4WD robot for the NULLLAB Maker-ESP32 (v1.7x) + 4x JGA25-371 encoder motors.
;
; Two firmware images share the same hardware code:
;   pio run -e bringup -t upload   -> serial bring-up / calibration tool (flash this FIRST)
;   pio run -e robot   -t upload   -> the robot itself, driven from a phone over Wi-Fi
;
; Every external dependency is pinned to an exact release so a build today and a
; build in a year produce the same firmware.

[platformio]
default_envs = robot

[env]
; pioarduino = community-maintained PlatformIO platform for Arduino-ESP32 3.x
; (55.03.312-1 -> Arduino-ESP32 3.3.12 on ESP-IDF 5.5). The board vendor's
; examples require Arduino-ESP32 >= 3.0.0, which the official PlatformIO
; platform does not ship.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev            ; ESP32-WROOM-32E, 4 MB flash
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800       ; reliable on the board's CH340G USB-serial chip
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    https://github.com/adafruit/Adafruit_NeoPixel.git#1.15.5

[env:robot]
build_src_filter = +<robot/> +<common/>
build_flags =
    ${env.build_flags}
    ; Keep the web server's network task on core 0 with Wi-Fi, away from the
    ; 100 Hz motor-control task on core 1.
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    ${env.lib_deps}
    https://github.com/ESP32Async/AsyncTCP.git#v3.5.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1

[env:bringup]
build_src_filter = +<bringup/> +<common/>
